schema_version: "1.0"
method_version: "1.2.0"

study_scope:
  territorial_unit: municipality
  state: Pará
  state_code: "15"
  expected_municipalities: 144
  expected_transport_scenarios: 12
  municipality_key: municipality_code
  selection_rule: all official municipalities in the fixed study area

research_target: >-
  Municipal prioritization for strengthening intersectoral response capacity
  to violence against women in Pará, considering institutional deficits,
  service-network availability, and multimodal accessibility constraints.

research_questions:
  primary: >-
    Which municipalities in Pará should be prioritized for strengthening
    intersectoral response capacity to violence against women when institutional
    deficits, service-network availability, and multimodal accessibility
    constraints are jointly considered?
  complementary: >-
    To what extent does municipal prioritization remain consistent across
    different aggregation methods and dimension-weighting schemes?

interpretive_context:
  female_population:
    role: contextual_and_denominator
    active_in_primary_score: false
  police_records_2022_2025:
    role: contextual_analysis
    active_in_primary_score: false
    interpretation: >-
      Observed records do not estimate incidence, hidden violence, individual
      risk, or underreporting.

inputs:
  municipal_matrix: data/processed/integrated_municipal_matrix.csv
  transport_scenarios: data/processed/transport/transport_multimodal_scenarios.csv
  municipal_boundaries: data/geospatial/pa_municipal_boundaries_2022_simplified.geojson

outputs:
  profiles: data/results/integrated_capacity_priority_profiles.csv
  scenarios: data/results/integrated_capacity_priority_scenarios.csv
  method: data/results/integrated_capacity_priority_method.json
  audit: data/results/integrated_capacity_priority_audit.json

normalization:
  method: within_sample_percentile_rank
  range: [0, 1]
  ties: average
  interpretation: higher values always mean greater strengthening priority

dimensions:
  institutional_deficit:
    indicators:
      - column: institutional_deficit_available_4
        direction: benefit
        transformation: observed_ratio
        denominator_column: institutional_coverage
        output_column: institutional_deficit_ratio
  service_network:
    aggregation: equal_component_mean
    components:
      health:
        indicators:
          - column: cnes_health_service_deficit
            direction: benefit
          - column: cnes_multidisciplinary_staff_deficit
            direction: benefit
      social_protection:
        indicators:
          - column: social_specialized_service_deficit
            direction: benefit
      justice:
        indicators:
          - column: justice_tjpa_access_deficit
            direction: benefit
      specialized_protection_network:
        indicators:
          - column: protection_network_validated_category_diversity
            direction: cost
          - column: protection_network_specialized_non_health_services
            direction: cost
  transport_barrier:
    source_rule: one_minus_each_transport_access_scenario

macro_weight_scenarios:
  equal_dimensions:
    institutional_deficit: 0.3333333333333333
    service_network_deficit: 0.3333333333333333
    transport_barrier: 0.3333333333333333
  institutional_emphasis:
    institutional_deficit: 0.50
    service_network_deficit: 0.25
    transport_barrier: 0.25
  service_network_emphasis:
    institutional_deficit: 0.25
    service_network_deficit: 0.50
    transport_barrier: 0.25
  transport_emphasis:
    institutional_deficit: 0.25
    service_network_deficit: 0.25
    transport_barrier: 0.50

robustness:
  quartile_fraction: 0.25
  robust_frequency: 0.75
  sensitive_frequency: 0.25
  top_k: 10

diagnostics:
  reference_transport_scenario: equal_modes__equal_roles
  reference_macro_weight_scenario: equal_dimensions
  spatial_autocorrelation:
    variable: top_quartile_frequency
    contiguity: first_order_queen
    row_standardized: true
    coordinate_precision: 6
    permutations: 999
    random_seed: 42
    alternative: greater
  outputs:
    correlations: data/results/capacity_dimension_correlations.csv
    scenario_agreement: data/results/capacity_scenario_agreement.csv
    municipality_explanations: data/results/capacity_municipality_explanations.csv
    spatial_autocorrelation: data/results/capacity_spatial_autocorrelation.json
    audit: data/results/capacity_diagnostics_audit.json

multimethod_validation:
  primary_method: hierarchical_additive
  validation_methods:
    topsis:
      normalization: vector
      criterion_direction: benefit
    promethee_ii:
      preference_function: usual
      strict_superiority: preference
      equality: indifference
  comparison:
    top_set_membership: tie_neutral_fractional
    top_set_masses: [10, 36]
  smaa:
    macro_weight_draws: 10000
    random_seed: 42
    transport_scenario_frequency: equal
    convex_hull_sampling: dirichlet_barycentric
    dirichlet_parameters: [1, 1, 1]
    convex_hull_vertices:
      institutional_emphasis: {institutional_deficit: 0.50, service_network_deficit: 0.25, transport_barrier: 0.25}
      service_network_emphasis: {institutional_deficit: 0.25, service_network_deficit: 0.50, transport_barrier: 0.25}
      transport_emphasis: {institutional_deficit: 0.25, service_network_deficit: 0.25, transport_barrier: 0.50}
  outputs:
    scores: data/results/multimethod_capacity_scores.csv
    agreement: data/results/multimethod_capacity_agreement.csv
    profiles: data/results/multimethod_capacity_profiles.csv
    smaa_summary: data/results/smaa_capacity_acceptability_summary.csv
    smaa_rank_acceptability: data/results/smaa_capacity_rank_acceptability.csv
    audit: data/results/multimethod_capacity_audit.json

input_audit:
  outputs:
    matrix: data/processed/capacity_framework_input_matrix.csv
    profile: data/processed/capacity_framework_indicator_profile.csv
    audit: data/processed/capacity_framework_input_audit.json

exclusions:
  outcomes:
    - police occurrence counts
    - police occurrence rates
    - inferred or estimated hidden violence incidence
    - population
  selection:
    - municipality-specific manual adjustments
    - post-result parameter tuning
    - personalized municipality highlighting

warnings:
  - The scores are relative decision-support constructs, not ground truth.
  - The model prioritizes strengthening intersectoral response capacity to violence against women and does not estimate violence incidence or underreporting.
  - Facility presence and mapped proximity do not measure service quality, capacity, frequency, affordability, travel time, or seasonality.
  - Profile labels are exploratory robustness summaries and not automatic funding decisions.
