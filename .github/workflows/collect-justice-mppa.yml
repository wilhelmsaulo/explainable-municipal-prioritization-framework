name: collect-justice-mppa

on:
  push:
    paths:
      - ".github/workflows/collect-justice-mppa.yml"
      - "src/empriority/justice_mppa.py"
  workflow_dispatch:

concurrency:
  group: collect-justice-mppa
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install lxml
      - name: Collect and integrate MPPA indicators
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from empriority.justice_mppa import collect_mppa_access_pa

          outputs = collect_mppa_access_pa()
          matrix_path = Path("data/processed/integrated_municipal_matrix.csv")
          matrix = pd.read_csv(matrix_path, dtype={"municipality_code": str})
          justice = pd.read_csv(outputs["justice_indicators"], dtype={"municipality_code": str})
          old = [c for c in matrix.columns if c.startswith("justice_mppa_")]
          if old:
              matrix = matrix.drop(columns=old)
          matrix = matrix.merge(justice.drop(columns=["municipality"], errors="ignore"), on="municipality_code", how="left")
          for column in [c for c in matrix.columns if c.startswith("justice_mppa_")]:
              matrix[column] = pd.to_numeric(matrix[column], errors="coerce").fillna(0).astype(int)
          assert len(matrix) == 144
          assert matrix["municipality_code"].nunique() == 144
          if matrix["justice_mppa_covered"].sum() <= 0:
              raise AssertionError("MPPA coverage is zero; refusing invalid integration")
          matrix.to_csv(matrix_path, index=False, encoding="utf-8")
          print(
              f"MPPA integrated: covered={int(matrix['justice_mppa_covered'].sum())}, "
              f"local={int(matrix['justice_mppa_local_unit'].sum())}, "
              f"specialized={int(matrix['justice_mppa_specialized_women'].sum())}."
          )
          PY
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/justice_mppa_indicators_pa.csv
          git add -f data/processed/justice_mppa_institutional_pages_pa.csv
          git add -f data/processed/justice_mppa_indicators_pa.metadata.json
          git add -f data/processed/integrated_municipal_matrix.csv
          git diff --cached --quiet || git commit -m "Store MPPA justice-access indicators"
          git pull --rebase origin main
          git push
