name: build-mapbiomas-road-indicators

on:
  push:
    paths:
      - ".github/workflows/build-mapbiomas-road-indicators.yml"
      - "src/empriority/transport_accessibility/mapbiomas_roads.py"
      - "data/manual/transport/mapbiomas_roads_2023.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mapbiomas-road-indicators-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "geopandas>=1.0,<2"
      - name: Download registered MapBiomas and IBGE inputs
        run: |
          python - <<'PY'
          import hashlib
          import urllib.request
          from pathlib import Path

          inputs = {
              "data/raw/transport/mapbiomas_state_roads/rodovia-estadual.zip": (
                  "https://brasil.mapbiomas.org/wp-content/uploads/sites/4/2023/08/rodovia-estadual.zip",
                  "364a070e9394a812b8eab3956c6056203decfde66d7771c679854d28d8b4fe05",
              ),
              "data/raw/transport/mapbiomas_federal_roads/rodovia-federal.zip": (
                  "https://brasil.mapbiomas.org/wp-content/uploads/sites/4/2023/08/rodovia-federal.zip",
                  "f507e9c2bdca50c1ee6814c07cd220c88e686c0aae2b88ca8baef0280d01ba94",
              ),
              "data/raw/transport/ibge/PA_Municipios_2023.zip": (
                  "https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/"
                  "malhas_municipais/municipio_2023/UFs/PA/PA_Municipios_2023.zip",
                  None,
              ),
          }
          for path_text, (url, expected_sha256) in inputs.items():
              path = Path(path_text)
              path.parent.mkdir(parents=True, exist_ok=True)
              urllib.request.urlretrieve(url, path)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if expected_sha256 and digest != expected_sha256:
                  raise SystemExit(f"SHA-256 mismatch for {path}: {digest}")
              print(path, path.stat().st_size, digest)
          PY
      - name: Build and audit 144 municipal road indicators
        run: |
          python - <<'PY'
          from empriority.transport_accessibility.mapbiomas_roads import (
              build_mapbiomas_road_indicators,
          )

          outputs = build_mapbiomas_road_indicators(
              "data/raw/transport/mapbiomas_state_roads/rodovia-estadual.zip",
              "data/raw/transport/mapbiomas_federal_roads/rodovia-federal.zip",
              "data/raw/transport/ibge/PA_Municipios_2023.zip",
          )
          print(outputs)
          PY
      - name: Upload geospatial inputs and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapbiomas-road-indicators-pa-2023
          path: |
            data/raw/transport/mapbiomas_state_roads
            data/raw/transport/mapbiomas_federal_roads
            data/raw/transport/ibge
            data/processed/transport/road_indicators_pa_2023.csv
            data/processed/transport/road_indicators_pa_2023_audit.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit audited indicators
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f             data/processed/transport/road_indicators_pa_2023.csv             data/processed/transport/road_indicators_pa_2023_audit.json
          git diff --cached --quiet || git commit -m "Store MapBiomas 2023 road indicators"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
