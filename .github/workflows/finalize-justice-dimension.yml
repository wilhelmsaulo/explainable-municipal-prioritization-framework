name: finalize-justice-dimension

on:
  push:
    paths:
      - ".github/workflows/finalize-justice-dimension.yml"
      - "src/empriority/justice_access.py"
      - "src/empriority/justice_mppa.py"
      - "src/empriority/justice_composite.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e . lxml
      - name: Collect, integrate and consolidate justice indicators
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from empriority.justice_access import collect_defensoria_access_pa
          from empriority.justice_mppa import collect_mppa_access_pa
          from empriority.justice_composite import build_justice_composite

          matrix_path = Path('data/processed/integrated_municipal_matrix.csv')
          status = {}

          def integrate(outputs, prefix):
              matrix = pd.read_csv(matrix_path, dtype={'municipality_code': str})
              data = pd.read_csv(outputs['justice_indicators'], dtype={'municipality_code': str})
              old = [c for c in matrix.columns if c.startswith(prefix)]
              if old:
                  matrix = matrix.drop(columns=old)
              matrix = matrix.merge(data.drop(columns=['municipality'], errors='ignore'), on='municipality_code', how='left')
              matrix.to_csv(matrix_path, index=False, encoding='utf-8')

          try:
              integrate(collect_defensoria_access_pa(), 'justice_dpe_')
              status['dpe'] = 'success'
          except Exception as exc:
              status['dpe'] = f'failed: {type(exc).__name__}: {exc}'

          try:
              integrate(collect_mppa_access_pa(), 'justice_mppa_')
              status['mppa'] = 'success'
          except Exception as exc:
              status['mppa'] = f'failed: {type(exc).__name__}: {exc}'

          try:
              build_justice_composite()
              status['composite'] = 'success'
          except Exception as exc:
              status['composite'] = f'failed: {type(exc).__name__}: {exc}'

          Path('data/processed/justice_dimension_status.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY
      - name: Commit outputs and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in data/processed/justice_* data/processed/integrated_municipal_matrix.csv; do
            [ -e "$file" ] && git add -f "$file"
          done
          git diff --cached --quiet || git commit -m "Finalize justice dimension"
          git pull --rebase origin main
          git push
