name: analyze-transport-indicators

on:
  push:
    paths:
      - ".github/workflows/analyze-transport-indicators.yml"
      - "src/empriority/transport_accessibility/analyze.py"
      - "src/empriority/transport_accessibility/integrate.py"
      - "data/processed/transport/transport_indicators_pa_integrated.csv"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/analyze-transport-indicators.yml"
      - "src/empriority/transport_accessibility/analyze.py"
      - "src/empriority/transport_accessibility/integrate.py"
      - "data/processed/transport/transport_indicators_pa_integrated.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analyze-transport-indicators-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Analyze distributions and redundancy
        run: |
          python - <<'PY'
          from empriority.transport_accessibility.analyze import (
              analyze_transport_indicators,
          )

          outputs = analyze_transport_indicators(
              "data/processed/transport/transport_indicators_pa_integrated.csv"
          )
          print(outputs)
          PY
      - name: Upload screening outputs
        uses: actions/upload-artifact@v4
        with:
          name: transport-indicator-screening-pa
          path: |
            data/processed/transport/transport_indicator_descriptive.csv
            data/processed/transport/transport_indicator_spearman.csv
            data/processed/transport/transport_indicator_redundancy.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit screening outputs
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/processed/transport/transport_indicator_descriptive.csv \
            data/processed/transport/transport_indicator_spearman.csv \
            data/processed/transport/transport_indicator_redundancy.json
          git diff --cached --quiet || git commit -m "Store transport indicator screening"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
