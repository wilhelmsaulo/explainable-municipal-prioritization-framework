name: geocode-protection-network

on:
  push:
    paths:
      - ".github/workflows/geocode-protection-network.yml"
      - "src/empriority/protection_network_geospatial.py"
      - "data/processed/protection_network_records_normalized_pa.csv"
  workflow_dispatch:

concurrency:
  group: geocode-protection-network
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Geocode public services and calculate accessibility
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          status_path = Path("data/processed/protection_network_geocoding_status.json")
          status_path.parent.mkdir(parents=True, exist_ok=True)
          status = {"executed_at_utc": datetime.now(timezone.utc).isoformat()}

          try:
              from empriority.protection_network_geospatial import build_protection_network_geospatial
              outputs = build_protection_network_geospatial()
              status.update({
                  "status": "success",
                  "outputs": {key: str(value) for key, value in outputs.items()},
              })
          except Exception as exc:
              status.update({
                  "status": "failed",
                  "error_type": type(exc).__name__,
                  "error": str(exc),
              })
              raise
          finally:
              status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2), encoding="utf-8")
              print(json.dumps(status, ensure_ascii=False, indent=2))
          PY
      - name: Commit geospatial outputs and status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in \
            data/cache/nominatim_protection_network.json \
            data/processed/protection_network_services_geocoded_pa.csv \
            data/processed/protection_network_geocoding_review_pa.csv \
            data/processed/municipal_seats_geocoded_pa.csv \
            data/processed/protection_network_accessibility_pa.csv \
            data/processed/protection_network_services_pa.geojson \
            data/processed/protection_network_geospatial.metadata.json \
            data/processed/protection_network_geocoding_status.json \
            data/processed/integrated_municipal_matrix.csv; do
            [ -e "$file" ] && git add -f "$file"
          done
          git diff --cached --quiet || git commit -m "Store protection-network geospatial accessibility outputs"
          git pull --rebase origin main
          git push
