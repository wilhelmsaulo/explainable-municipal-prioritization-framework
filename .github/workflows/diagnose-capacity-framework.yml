name: diagnose-capacity-framework

on:
  workflow_dispatch:
  push:
    paths:
      - "config/capacity_priority.yml"
      - "src/empriority/capacity_diagnostics.py"
      - "src/empriority/spatial_autocorrelation.py"
      - "data/geospatial/pa_municipal_boundaries_2022_simplified.geojson"
      - "src/empriority/cli.py"
      - "data/processed/transport/transport_multimodal_scenarios.csv"
      - "data/results/integrated_capacity_priority_profiles.csv"
      - "data/results/integrated_capacity_priority_scenarios.csv"
  pull_request:
    paths:
      - "config/capacity_priority.yml"
      - "src/empriority/capacity_diagnostics.py"
      - "src/empriority/cli.py"
      - "data/processed/transport/transport_multimodal_scenarios.csv"
      - "data/results/integrated_capacity_priority_profiles.csv"
      - "data/results/integrated_capacity_priority_scenarios.csv"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Run capacity diagnostics
        run: >-
          empriority diagnose-capacity-framework
          --config config/capacity_priority.yml
      - name: Verify diagnostics are reproducible
        run: |
          git diff --exit-code -- \
            data/results/capacity_dimension_correlations.csv \
            data/results/capacity_scenario_agreement.csv \
            data/results/capacity_municipality_explanations.csv \
            data/results/capacity_spatial_autocorrelation.json \
            data/results/capacity_diagnostics_audit.json
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: capacity-diagnostics
          path: |
            data/results/capacity_dimension_correlations.csv
            data/results/capacity_scenario_agreement.csv
            data/results/capacity_municipality_explanations.csv
            data/results/capacity_spatial_autocorrelation.json
            data/results/capacity_diagnostics_audit.json
