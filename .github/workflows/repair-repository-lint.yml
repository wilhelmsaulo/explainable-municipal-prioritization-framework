name: repair-repository-lint

on:
  push:
    paths:
      - ".github/workflows/repair-repository-lint.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/repair-repository-lint.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-repository-lint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply safe Ruff repairs and formatting
        run: |
          ruff check --fix . || true
          ruff format .
          python -m compileall -q src tests
          git diff --check
      - name: Commit mechanical repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet || git commit -m "Apply safe repository lint repairs"
          TARGET_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
