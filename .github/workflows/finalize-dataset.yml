name: finalize-dataset

on:
  push:
    paths:
      - "src/empriority/finalize_dataset.py"
      - "src/empriority/matrix_audit.py"
      - ".github/workflows/finalize-dataset.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Clean and audit integrated dataset
        run: |
          python - <<'PY'
          from empriority.finalize_dataset import finalize_dataset
          outputs = finalize_dataset()
          print({name: str(path) for name, path in outputs.items()})
          PY
      - name: Commit finalized dataset and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/processed
          git diff --cached --quiet || git commit -m "Finalize and audit integrated dataset"
          git pull --rebase origin main
          git push
