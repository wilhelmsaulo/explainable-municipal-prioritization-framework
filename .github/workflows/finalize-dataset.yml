name: finalize-dataset

on:
  push:
    paths:
      - "src/empriority/finalize_dataset_v2.py"
      - "scripts/run_pipeline.py"
      - ".github/workflows/finalize-dataset.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run portable finalization pipeline
        run: python scripts/run_pipeline.py --stage finalize
      - name: Commit finalized dataset and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u data/processed
          git add -f \
            data/processed/integrated_municipal_matrix.csv \
            data/processed/integrated_matrix_audit.json \
            data/processed/integrated_matrix_column_profile.csv \
            data/processed/modeling_readiness_columns.csv \
            data/processed/modeling_readiness_status.json \
            data/processed/dataset_finalization_status.json

          git diff --cached --quiet || git commit -m "Finalize and audit integrated dataset"
          git pull --rebase origin main
          git push
