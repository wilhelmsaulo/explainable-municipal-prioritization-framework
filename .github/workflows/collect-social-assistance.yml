name: collect-social-assistance

on:
  push:
    paths:
      - ".github/workflows/collect-social-assistance.yml"
      - "src/empriority/social_assistance.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Collect and integrate social-assistance indicators
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          from empriority.social_assistance import collect_social_assistance_pa

          outputs = collect_social_assistance_pa("data/processed")
          matrix_path = Path("data/processed/integrated_municipal_matrix.csv")
          matrix = pd.read_csv(matrix_path, dtype={"municipality_code": str})
          social = pd.read_csv(outputs["social_indicators"], dtype={"municipality_code": str})

          matrix["_municipality_code_6"] = matrix["municipality_code"].str[:6]
          social = social.rename(columns={"municipality_code": "_municipality_code_6"})
          old_columns = [column for column in matrix.columns if column.startswith("social_")]
          if old_columns:
              matrix = matrix.drop(columns=old_columns)
          matrix = matrix.merge(social, on="_municipality_code_6", how="left")
          matrix = matrix.drop(columns="_municipality_code_6")

          count_columns = [column for column in matrix.columns if column.startswith("social_")]
          for column in count_columns:
              matrix[column] = pd.to_numeric(matrix[column], errors="coerce").fillna(0)

          if matrix["social_cras"].sum() <= 0 or matrix["social_creas"].sum() <= 0:
              raise AssertionError("CRAS/CREAS totals are zero; refusing invalid integration")
          assert len(matrix) == 144
          assert matrix["municipality_code"].nunique() == 144

          population = pd.to_numeric(matrix["population_2023"], errors="coerce")
          for column in [
              "social_cras",
              "social_creas",
              "social_centro_pop",
              "social_centro_dia",
              "social_centros_convivencia",
              "social_unidades_acolhimento",
              "social_cras_professionals",
              "social_creas_professionals",
          ]:
              matrix[f"{column}_per_100k_population"] = matrix[column] / population * 100_000

          matrix.to_csv(matrix_path, index=False, encoding="utf-8")
          print(
              f"Social assistance integrated: {len(matrix)} municipalities, "
              f"CRAS={int(matrix['social_cras'].sum())}, "
              f"CREAS={int(matrix['social_creas'].sum())}."
          )
          PY
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/social_assistance_indicators_pa.csv
          git add -f data/processed/social_assistance_indicators_pa.metadata.json
          git add -f data/processed/integrated_municipal_matrix.csv
          git diff --cached --quiet || git commit -m "Store social-assistance indicators"
          git pull --rebase origin main
          git push
