name: collect-munic-2023

on:
  push:
    paths:
      - ".github/workflows/collect-munic-2023.yml"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Collect MUNIC 2023
        run: empriority munic --year 2023
      - name: Upload MUNIC outputs
        uses: actions/upload-artifact@v4
        with:
          name: munic-2023
          path: |
            data/raw/munic/Base_MUNIC_2023.xlsx
            data/processed/munic_2023_inventory.csv
            data/processed/munic_2023_inventory.metadata.json
          if-no-files-found: error
