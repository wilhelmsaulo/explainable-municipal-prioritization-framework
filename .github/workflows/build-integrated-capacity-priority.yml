name: build-integrated-capacity-priority

on:
  push:
    paths:
      - ".github/workflows/build-integrated-capacity-priority.yml"
      - "src/empriority/integrated_priority.py"
      - "data/processed/integrated_municipal_matrix.csv"
      - "data/processed/transport/transport_multimodal_scenarios.csv"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-integrated-capacity-priority.yml"
      - "src/empriority/integrated_priority.py"
      - "data/processed/integrated_municipal_matrix.csv"
      - "data/processed/transport/transport_multimodal_scenarios.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-integrated-capacity-priority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Calculate and audit integrated priority profiles
        run: |
          python - <<'PY'
          from empriority.integrated_priority import (
              build_integrated_priority_profiles,
          )

          outputs = build_integrated_priority_profiles(
              "data/processed/integrated_municipal_matrix.csv",
              "data/processed/transport/transport_multimodal_scenarios.csv",
          )
          print(outputs)
          PY
      - name: Upload integrated outputs
        uses: actions/upload-artifact@v4
        with:
          name: integrated-capacity-priority-pa
          path: |
            data/results/integrated_capacity_priority_profiles.csv
            data/results/integrated_capacity_priority_scenarios.csv
            data/results/integrated_capacity_priority_method.json
            data/results/integrated_capacity_priority_audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit audited outputs
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/results/integrated_capacity_priority_profiles.csv \
            data/results/integrated_capacity_priority_scenarios.csv \
            data/results/integrated_capacity_priority_method.json \
            data/results/integrated_capacity_priority_audit.json
          git diff --cached --quiet || git commit -m "Store integrated capacity priority profiles"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
