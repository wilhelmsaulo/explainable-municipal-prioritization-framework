name: build-munic-2023-indicators-v2

on:
  push:
    paths:
      - ".github/workflows/build-munic-2023-indicators-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build and validate MUNIC 2023 indicators
        run: |
          python - <<'PY'
          import pandas as pd
          from empriority.munic_indicators import extract_munic_2023_institutional_indicators

          path = extract_munic_2023_institutional_indicators(
              'data/catalog/munic_2023_pa/politica_para_mulheres.csv',
              'data/catalog/munic_2023_pa/seguranca_publica.csv',
              'data/catalog/munic_2023_pa/direitos_humanos.csv',
              'data/processed/munic_2023_institutional_indicators_pa.csv',
          )
          frame = pd.read_csv(path)
          if len(frame) != 144 or frame['municipality_code'].nunique() != 144:
              raise SystemExit(f'Invalid municipal coverage: rows={len(frame)}, unique={frame["municipality_code"].nunique()}')
          print(frame.shape)
          print(frame[['municipality_code','municipality','institutional_score_available_4','institutional_coverage']].head())
          PY
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/munic_2023_institutional_indicators_pa.csv
          git commit -m "Store MUNIC 2023 institutional indicators" || exit 0
          git push origin main
