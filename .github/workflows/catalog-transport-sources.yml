name: catalog-transport-sources

on:
  push:
    paths:
      - ".github/workflows/catalog-transport-sources.yml"
      - "src/empriority/transport_accessibility/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-transport-sources
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Probe official multimodal sources
        run: |
          python - <<'PY'
          from empriority.transport_accessibility import build_transport_source_catalog
          outputs = build_transport_source_catalog()
          print(outputs)
          PY
      - name: Commit transport source catalog
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/transport/official_transport_sources.json || true
          git add -f data/processed/transport/transport_source_status.json || true
          git diff --cached --quiet || git commit -m "Store official transport source catalog"
          git pull --rebase origin main
          git push
