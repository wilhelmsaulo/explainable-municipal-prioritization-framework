name: test-dashboard

on:
  push:
    paths:
      - "dashboard/**"
      - "dashboard/tests/**"
      - "pyproject.toml"
      - "data/results/**"
      - "data/processed/integrated_municipal_matrix.csv"
      - ".github/workflows/test-dashboard.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - "dashboard/tests/**"
      - "pyproject.toml"
      - "data/results/**"
      - "data/processed/integrated_municipal_matrix.csv"
      - ".github/workflows/test-dashboard.yml"
  workflow_dispatch:

concurrency:
  group: test-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dashboard and test dependencies
        run: python -m pip install -e ".[dashboard,dev]"
      - name: Validate dashboard data contract
        run: python -m pytest dashboard/tests/test_data.py --no-cov
      - name: Lint dashboard
        run: python -m ruff check dashboard
      - name: Confirm Streamlit starts
        shell: bash
        run: |
          python -m streamlit run dashboard/app.py \
            --server.headless true \
            --server.port 8501 \
            > /tmp/empriority-dashboard.log 2>&1 &
          dashboard_pid=$!
          trap 'kill "$dashboard_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          sed -n '1,200p' /tmp/empriority-dashboard.log
          exit 1
