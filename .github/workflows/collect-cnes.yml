name: collect-cnes

on:
  push:
    paths:
      - ".github/workflows/collect-cnes.yml"
      - "src/empriority/cnes.py"
      - "src/empriority/cnes_drive.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e . gdown
      - name: Download official CNES archive from Drive
        run: |
          mkdir -p data/processed/cnes_bulk
          gdown --id 1QrSnlZt-5tF_7uVvn1YSSsZ38NWrMWBb \
            --output data/processed/cnes_bulk/BASE_DE_DADOS_CNES_202606.ZIP
          python - <<'PY'
          from pathlib import Path
          import zipfile

          archive = Path("data/processed/cnes_bulk/BASE_DE_DADOS_CNES_202606.ZIP")
          if not archive.exists() or archive.stat().st_size < 100_000_000:
              raise RuntimeError(f"CNES archive download is incomplete: {archive.stat().st_size if archive.exists() else 0} bytes")
          if not zipfile.is_zipfile(archive):
              raise RuntimeError("Downloaded CNES file is not a valid ZIP archive.")
          print(f"Validated CNES archive: {archive.stat().st_size / 1_048_576:.1f} MB")
          PY
      - name: Collect CNES and integrate matrix
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          from empriority.cnes_drive import collect_cnes_pa_from_archive

          outputs = collect_cnes_pa_from_archive(
              "data/processed/cnes_bulk/BASE_DE_DADOS_CNES_202606.ZIP",
              "data/processed",
          )
          matrix_path = Path("data/processed/integrated_municipal_matrix.csv")
          matrix = pd.read_csv(matrix_path, dtype={"municipality_code": str})
          cnes = pd.read_csv(outputs["cnes_indicators"], dtype={"municipality_code": str})

          matrix["_cnes_municipality_code"] = matrix["municipality_code"].str[:6]
          cnes = cnes.rename(columns={"municipality_code": "_cnes_municipality_code"})
          if "municipality" in cnes.columns:
              cnes = cnes.drop(columns="municipality")

          old_cnes = [column for column in matrix.columns if column.startswith("cnes_")]
          if old_cnes:
              matrix = matrix.drop(columns=old_cnes)

          matrix = matrix.merge(cnes, on="_cnes_municipality_code", how="left")
          matrix = matrix.drop(columns="_cnes_municipality_code")

          count_columns = [
              "cnes_active_establishments",
              "cnes_ubs",
              "cnes_hospitals",
              "cnes_caps",
              "cnes_emergency_units",
              "cnes_obstetric_centers",
              "cnes_health_service_deficit",
          ]
          missing = [column for column in count_columns if column not in matrix.columns]
          if missing:
              raise AssertionError(f"Missing CNES columns: {missing}")

          unmatched = matrix.loc[matrix["cnes_active_establishments"].isna(), [
              "municipality_code", "municipality"
          ]]
          if not unmatched.empty:
              unmatched.to_csv(
                  "data/processed/cnes_unmatched_municipalities.csv",
                  index=False,
                  encoding="utf-8",
              )
              raise AssertionError(
                  "CNES municipality matching failed: "
                  + ", ".join(unmatched["municipality"].astype(str))
              )

          for column in count_columns:
              matrix[column] = pd.to_numeric(matrix[column], errors="coerce").fillna(0).astype(int)

          population = pd.to_numeric(matrix["population_2023"], errors="coerce")
          for column in [
              "cnes_active_establishments",
              "cnes_ubs",
              "cnes_hospitals",
              "cnes_caps",
              "cnes_emergency_units",
              "cnes_obstetric_centers",
          ]:
              matrix[f"{column}_per_100k_population"] = matrix[column] / population * 100_000

          assert len(matrix) == 144
          assert matrix["municipality_code"].nunique() == 144
          assert matrix["cnes_active_establishments"].notna().sum() == 144

          matrix.to_csv(matrix_path, index=False, encoding="utf-8")
          print(
              f"CNES integrated: {len(matrix)} municipalities, "
              f"{int(matrix['cnes_active_establishments'].sum())} active establishments."
          )
          PY
      - name: Commit CNES outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/cnes_establishments_pa.csv
          git add -f data/processed/cnes_unit_types.csv
          git add -f data/processed/cnes_municipal_indicators_pa.csv
          git add -f data/processed/cnes_municipal_indicators_pa.metadata.json
          git add -f data/processed/integrated_municipal_matrix.csv
          if [ -f data/processed/cnes_unmatched_municipalities.csv ]; then
            git add -f data/processed/cnes_unmatched_municipalities.csv
          fi
          git diff --cached --quiet || git commit -m "Store CNES municipal indicators"
          git push
