name: collect-and-commit-munic-2023

on:
  push:
    paths:
      - ".github/workflows/collect-and-commit-munic-2023.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Collect MUNIC 2023
        run: empriority munic --year 2023
      - name: Store MUNIC inventory in repository
        run: |
          mkdir -p data/catalog
          cp data/processed/munic_2023_inventory.csv data/catalog/munic_2023_inventory.csv
          cp data/processed/munic_2023_inventory.metadata.json data/catalog/munic_2023_inventory.metadata.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/catalog/munic_2023_inventory.csv data/catalog/munic_2023_inventory.metadata.json
          git commit -m "Store MUNIC 2023 inventory" || exit 0
          git push origin main
