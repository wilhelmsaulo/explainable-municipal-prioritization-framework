name: collect-justice-tjpa

on:
  push:
    paths:
      - ".github/workflows/collect-justice-tjpa.yml"
      - "src/empriority/justice_tjpa.py"
  workflow_dispatch:

concurrency:
  group: collect-justice-tjpa
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install lxml
      - name: Collect and integrate TJPA indicators
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from empriority.justice_tjpa import collect_tjpa_access_pa

          outputs = collect_tjpa_access_pa()
          matrix_path = Path("data/processed/integrated_municipal_matrix.csv")
          matrix = pd.read_csv(matrix_path, dtype={"municipality_code": str})
          justice = pd.read_csv(outputs["indicators"], dtype={"municipality_code": str})
          old = [c for c in matrix.columns if c.startswith("justice_tjpa_")]
          if old:
              matrix = matrix.drop(columns=old)
          matrix = matrix.merge(justice.drop(columns=["municipality"], errors="ignore"), on="municipality_code", how="left")
          columns = [c for c in matrix.columns if c.startswith("justice_tjpa_")]
          for column in columns:
              matrix[column] = pd.to_numeric(matrix[column], errors="coerce").fillna(0).astype(int)
          assert len(matrix) == 144
          assert matrix["municipality_code"].nunique() == 144
          if matrix["justice_tjpa_local_access"].sum() <= 0:
              raise AssertionError("TJPA local coverage is zero")
          matrix.to_csv(matrix_path, index=False, encoding="utf-8")
          print(
              f"TJPA integrated: municipalities={int(matrix['justice_tjpa_local_access'].sum())}, "
              f"units={int(matrix['justice_tjpa_units'].sum())}."
          )
          PY
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/justice_tjpa_indicators_pa.csv
          git add -f data/processed/justice_tjpa_directory_raw_pa.csv
          git add -f data/processed/justice_tjpa_indicators_pa.metadata.json
          git add -f data/processed/integrated_municipal_matrix.csv
          git diff --cached --quiet || git commit -m "Store TJPA justice-access indicators"
          git pull --rebase origin main
          git push
