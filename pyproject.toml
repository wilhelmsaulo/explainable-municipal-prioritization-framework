[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "empriority"
version = "0.1.0"
description = "Explainable municipal prioritization framework using official Brazilian public data."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Saulo Costa" }]
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "respx>=0.21,<1",
  "ruff>=0.5,<1",
]

[project.scripts]
empriority = "empriority.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/empriority"]

[tool.pytest.ini_options]
addopts = "-q --cov=empriority --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
